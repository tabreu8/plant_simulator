services:
  plant-simulator:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: plant_simulator
    restart: unless-stopped
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=
      - MQTT_PASSWORD=
      - SIMULATION_SPEED=1.0
      - LOG_LEVEL=INFO
    depends_on:
      mqtt-broker:
        condition: service_started
    networks:
      - plant-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('mqtt-broker', 1883))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mqtt-broker:
    image: coreflux/coreflux-mqtt-broker:1.6.4
    container_name: mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:5000"  # WebSocket port for web clients (external 9001 -> internal 5000)
    networks:
      - plant-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  plant-network:
    driver: bridge
